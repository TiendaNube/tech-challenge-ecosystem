version: '3.8'
services:
  db_test:
    image: postgres:15
    ports:
      - 5433:5432
    restart: always
    container_name: integration-tests-prisma
    environment:
      - POSTGRES_DB=tests
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cbh_thc_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    container_name: tech-challenge-redis
    image: redis:7.0.11
    restart: always
    ports:
      - '6379:6379'
    networks:
      - cbh_thc_network

networks:
  cbh_thc_network:
    driver: bridge

volumes:
  postgres_data:
