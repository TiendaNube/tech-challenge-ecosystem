version: '3.8'
services:
  db:
    image: postgres:15
    ports:
      - 5432:5432
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=techchallenge
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - cbh_thc_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    container_name: tech-challenge-redis
    image: redis:7.0.11
    restart: always
    ports:
      - '6379:6379'
    networks:
      - cbh_thc_network
  app_dev:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    command: -c "chmod +x ./entrypoint.sh"
    volumes:
      - ./:/app
      - ./node_modules:/app/node_modules
    ports:
      - 3333:3333
    depends_on:
      - redis
      - db
    networks:
      - cbh_thc_network
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/techchallenge
      - REDIS_HOST=redis
      - REDIS_PORT=6379

networks:
  cbh_thc_network:
    driver: bridge

volumes:
  postgres_data:
  postgres_data_prod:
